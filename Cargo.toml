[package]
name = "hex-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Hex viewing and byte-patching of binary files, as an MCP server"
license = "Unlicense"
repository = "https://github.com/Bluscream/hex-mcp"
readme = "README.md"
keywords = ["mcp", "hex", "binary", "patch"]
categories = ["command-line-utilities"]

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
hex = "0.4.3"
mcp-toolkit = { git = "https://github.com/Bluscream/mcp-toolkit", branch = "main" }
memchr = "2.8.3"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
